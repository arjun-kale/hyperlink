name: Release

# Builds both apps and publishes them on a GitHub Release when a version tag
# (e.g. v0.3.0) is pushed.
#
# Android signing uses these repository secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore file
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (e.g. hyperlink)
#   ANDROID_KEY_PASSWORD      key password
# Without them the APK is debug-signed and the release is marked as a pre-release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Build
        run: cargo build --release -p hyperlink-linux --features video
      - name: Package
        run: |
          name="hyperlink-linux-${GITHUB_REF_NAME}-x86_64"
          mkdir -p "$name/target/release"
          cp target/release/hyperlink-linux "$name/target/release/"
          cp -r --parents linux/data linux/packaging README.md LICENSE "$name/"
          printf 'Install for your user:\n  ./linux/packaging/install-local.sh --no-build\n' > "$name/INSTALL.txt"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: hyperlink-linux-*.tar.gz

  android:
    name: Android app
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release keystore secrets; the APK will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "../HyperLink-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: HyperLink-*.apk

  publish:
    name: Publish release
    needs: [linux, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Download the APK on your phone and the Linux archive on your computer. See README for setup."
          flags=""
          if [ "${{ needs.android.outputs.signed }}" != "true" ]; then
            flags="--prerelease"
            notes="$notes

          Note: this APK is debug-signed (test build)."
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "HyperLink $GITHUB_REF_NAME" --notes "$notes" $flags
